name: Build Stremio

on:
  push:
    paths:
      - 'pkgs/by-name/st/stremio/**'
      - '.github/workflows/stremio.yml'
  pull_request:
    paths:
      - 'pkgs/by-name/st/stremio/**'
      - '.github/workflows/stremio.yml'
  workflow_dispatch:

concurrency:
  group: stremio-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    name: Build stremio on ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@7ec16f2c061ab07b235a7245e06ed46fe9a1cab6 # v31
        with:
          extra_nix_config: sandbox = true

      - name: Setup Cachix
        uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad # v16
        continue-on-error: true
        with:
          name: nixpkgs-gha
          extraPullNames: nixpkgs-gha

      - name: Build stremio
        run: |
          nix-build -E 'with import ./. { config.allowUnfree = true; }; stremio' --show-trace

      - name: Check build result
        run: |
          if [ -f result ]; then
            echo "Build successful!"
            ls -lh result
            file result || true
          else
            echo "Build failed - no result file"
            exit 1
          fi

